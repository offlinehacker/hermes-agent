# Build Hermes Light, the remote-only Hermes desktop client, for the latest
# upstream stable release with patches/ applied, and publish Linux AppImages
# and macOS DMG/ZIP files as a release of this repository.
#
# The schedule only builds a tag that has no release here yet. A push that
# changes the patches or scripts rebuilds the current tag and replaces its
# assets; a manual run can build any stable tag.
name: Hermes Light

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream stable tag to build (empty = latest release)
        required: false
        default: ''
      rebuild:
        description: Rebuild and replace the assets of an existing release
        type: boolean
        default: false
  push:
    branches: [hermes-light]
    paths:
      - patches/**
      - scripts/**
      - .github/workflows/hermes-light.yml

permissions:
  contents: read

concurrency:
  group: hermes-light
  cancel-in-progress: false

env:
  UPSTREAM: NousResearch/hermes-agent

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
      latest: ${{ steps.pick.outputs.latest }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REBUILD: ${{ inputs.rebuild }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          upstream_latest="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          tag="${INPUT_TAG:-$upstream_latest}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a stable vX.Y.Z tag"
            exit 1
          fi
          release="$tag-light"
          build=true
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            case "$EVENT" in
              push) ;;
              workflow_dispatch) [ "$REBUILD" = true ] || build=false ;;
              *) build=false ;;
            esac
          fi
          {
            echo "tag=$tag"
            echo "release=$release"
            echo "latest=$([ "$tag" = "$upstream_latest" ] && echo true || echo false)"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream \`$tag\` → release \`$release\` (build: $build)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, name: linux-x64 }
          - { runner: ubuntu-24.04-arm, name: linux-arm64 }
          - { runner: macos-15, name: macos-arm64 }
          - { runner: macos-15-intel, name: macos-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          path: packaging
          persist-credentials: false

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: refs/tags/${{ env.TAG }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Native build dependencies
        if: runner.os == 'Linux'
        # The HUD modifier's X11 helper is optional; without these headers the
        # build only logs that it skipped it.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libxi-dev

      - name: Apply patches
        working-directory: src
        run: |
          shopt -s nullglob
          patches=(../packaging/patches/*.patch)
          [ "${#patches[@]}" -eq 0 ] ||
            git -c user.name='Hermes Light' -c user.email='hermes-light@users.noreply.github.com' \
              am --3way "${patches[@]}"

      - name: Build
        # Electron and toolset downloads from GitHub fail with an occasional 504.
        run: |
          for attempt in 1 2 3; do
            packaging/scripts/build-light.sh src "$TAG" && exit 0
            echo "::warning::build attempt $attempt failed"
            sleep 30
          done
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-light-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src/apps/desktop/release/HermesLight-*.AppImage
            src/apps/desktop/release/HermesLight-*.dmg
            src/apps/desktop/release/HermesLight-*.zip

  release:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE: ${{ needs.resolve.outputs.release }}
      LATEST: ${{ needs.resolve.outputs.latest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hermes-light-*
          merge-multiple: true
          path: dist

      - name: Publish
        run: |
          set -euo pipefail
          (cd dist && sha256sum HermesLight-* > SHA256SUMS)
          scripts/release-notes.sh "$TAG" > notes.md
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Hermes Light ${TAG#v}" --notes-file notes.md --latest="$LATEST"
          fi
